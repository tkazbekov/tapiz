server_tokens off;

server {
    listen 80 default_server;
    client_max_body_size 100M;
    large_client_header_buffers 4 32k;
    charset utf-8;

    # Front
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;

        # Content-Security-Policy for the web app. No inline scripts are
        # allowed; inline styles are needed by Angular and the rich-text
        # editor. connect-src must reach API_URL and WS_URL, which are set at
        # build time: 'self' covers the nginx /api/ and /socket.io/ proxy,
        # https:/wss: cover TLS deployments and http://localhost:* covers the
        # default .env. If the browser talks to a plain-http API on another
        # host, add that origin (e.g. http://10.0.0.5:8000 ws://10.0.0.5:8000)
        # to connect-src, and to img-src for uploaded images, then rebuild the
        # web image.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https: http://localhost:*; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https: wss: http://localhost:* ws://localhost:*" always;
    }

    # API
    location /api/ {
      proxy_pass http://api:8000/api/;
      proxy_pass_header Server;
      proxy_set_header Host $http_host;
      proxy_redirect off;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Scheme $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Events
    location /socket.io/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 7d;
      proxy_send_timeout 7d;
      proxy_read_timeout 7d;
    }
}
